<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Posts Management</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/title.png') }}">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 30px;
      position: relative;
    }

    /* 🔙 Back button style */
    .back-btn {
      position: absolute;
      top: 25px;
      left: 25px;
      background: linear-gradient(145deg, #3498db, #2980b9);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 10px 20px;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(52, 152, 219, 0.7);
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: linear-gradient(145deg, #2980b9, #3498db);
      box-shadow: 0 0 25px rgba(41, 128, 185, 0.9);
      transform: scale(1.05);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    th, td {
      padding: 12px 15px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #3498db;
      color: white;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    .product-image {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid #ddd;
    }

    .action-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      font-size: 14px;
    }

    .btn-action {
      background-color: #27ae60;
    }

    .btn-delete {
      background-color: #e74c3c;
    }

    .btn-action:hover {
      background-color: #2ecc71;
    }

    .btn-delete:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>

  <!-- 🔙 Back button -->
  <button class="back-btn" onclick="window.location.href='{{ url_for('admin_dash') }}'">⬅ Back</button>

  <h2>📋 Admin Posts Overview</h2>

  <table>
    <thead>
      <tr>
        <th>Username</th>
        <th>Content</th>
        <th>Image</th>
        <th>Detection</th>
        <th>Timestamp</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      {% for item in prices %}
      <tr>
        <td>{{ item[1] }}</td>
        <td>{{ item[2] }}</td>
        <td>
          <img src="{{ url_for('static', filename='uploads/' + item[3].split('/')[-1]) }}" 
               class="product-image" alt="Image">
        </td>    
        <td>{{ item[4] }}</td>
        <td>{{ item[5] }}</td>

        <td>
          <!-- Action button -->
          <form action="/get_username" method="POST" style="margin-bottom: 5px;">
            <input type="hidden" name="username" value="{{ item[1] }}">
            <input type="hidden" name="content" value="{{ item[2] }}">
            <input type="hidden" name="image" value="{{ item[3] }}">
            <input type="hidden" name="detection" value="{{ item[4] }}">
            <input type="hidden" name="timestamp" value="{{ item[5] }}">
            <button type="submit" class="action-btn btn-action">Action</button>
          </form>

          <!-- Delete button -->
          <form action="{{ url_for('delete_post', post_id=item[0]) }}" method="POST"
                onsubmit="return confirm('Are you sure you want to delete this post?');">
            <button type="submit" class="action-btn btn-delete">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

</body>
</html>
