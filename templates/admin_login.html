<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login</title>
  <link rel="icon" type="image/png" href="static/title-icon/title-icon.jpg">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      height: 100%;
      font-family: 'Arial', sans-serif;
    }
    .split-container {
      display: flex;
      height: 100vh;
    }

    .left-panel {
      width: 50%;
      background-color: #022b30;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      text-align: center;
    }

    .left-panel img {
      width: 100px;
      margin-bottom: 20px;
    }

    .left-panel h1 {
      font-size: 28px;
      font-weight: 500;
    }

    .right-panel {
      width: 50%;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .admin-login-container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
    }

    h2 {
      margin-bottom: 10px;
      color: #333;
    }

    .subtext {
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background: #ff6600;
      color: white;
      padding: 10px;
      border: none;
      width: 100%;
      margin-top: 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #e65c00;
    }

    .flash-messages {
      margin-bottom: 10px;
    }

    .flash-messages div {
      padding: 10px;
      border-radius: 5px;
    }

    .success {
      background: #d4edda;
      color: #155724;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
    }

    p {
      margin-top: 15px;
      font-size: 14px;
    }

    a {
      color: #007bff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="split-container">

    <!-- Left Side -->
    <div class="left-panel">
      <img src="{{ url_for('static', filename='icon/admin.png') }}" alt="Logo"/>
      <h1>You don't need a cape to be a hero — just be an admin.</h1>
    </div>

    <!-- Right Side -->
    <div class="right-panel">
      <div class="admin-login-container">
        <h2>Welcome</h2>
        <div class="subtext">Please login to Admin Dashboard</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-messages">
              {% for category, message in messages %}
                <div class="{{ category }}">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="/admin_login">
          <label>Username:</label>
          <input type="text" name="username" required />

          <label>Password:</label>
          <input type="password" name="password" required />

          <button type="submit">Login</button>
        </form>
        <p>Back to <a href="{{ url_for('home') }}">Home</a></p>
      </div>
    </div>

  </div>

</body>
</html>
