<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="icon" type="image/png" href="static/title-icon/title-icon.jpg">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('static/admin.jpg');
            background-position: center;
            background-repeat: repeat;
            background-size: cover;
        }
        .header {
            background: #000000;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .header h2 {
            margin: 0;
            font-size: 20px;
        }
        .header .buttons {
            display: flex;
            gap: 10px;
        }
        .header a {
            background: white;
            color: #007bff;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s ease-in-out;
        }
        .header a:hover {
            background: #0056b3;
            color: white;
        }
        .container {
            padding: 20px;
            text-align: center;
        }
        /* Feed Container */
        .feed {
            width: 500px;
            margin-top: 20px;
        }

        /* Post Card */
        .post-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Post Header (Profile + Name + Timestamp) */
        .post-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }

        /* Username & Timestamp */
        /* Username & Timestamp */
        .username {
            font-weight: bold;
            color: #1da1f2;
            font-size: 20px; /* Increased from 14px to 16px for better visibility */
        }

        .timestamp {
            color: #657786;
            font-size: 13px; /* Increased from 12px to 13px for better readability */
            margin-left: 5px;
        }

        /* Post Content */
        .post-content {
            font-size: 20px; /* Increased from 15px to 17px for better visibility */
            color: #14171a;
            margin-bottom: 10px;
            line-height: 1.5; /* Added line height for better spacing */
        }

        /* Post Card */
        .post-card {
            background: white;
            border-radius: 12px;
            padding: 20px; /* Increased padding for a more spacious look */
            margin-bottom: 15px;
            box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.15); /* Slightly stronger shadow */
        }


        /* Post Image */
        .post-image {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* No Posts Message */
        .no-posts {
            text-align: center;
            font-size: 16px;
            color: #657786;
        }
    </style>
</head>


  
    <body>
        <div class="header">
            <h2>Admin Dashboard</h2>
            <div class="buttons">
                <a href="{{ url_for('show_prices') }}" >Action</a>
                <a href="/" >Logout</a>
               
            </div>
        </div>
        <center>

        <div class="feed">
            {% for post in posts %}
            <div class="post-card">
                <div class="post-header">
                    <img class="profile-pic" src="{{ url_for('static', filename='profile.png') }}" alt="Profile">
                    <div>
                        <strong class="username">{{ post['username'] }}</strong>
                        <span class="timestamp">{{ post['timestamp'] }}</span>
                    </div>
                </div>
                <p class="post-content">{{ post['content'] }}</p>
                {% if post['image'] %}
                    <img src="{{ url_for('static', filename='uploads/' + post['image'].replace('\\', '/').split('/')[-1]) }}" 
                        alt="Post Image" width="300"><br>
                {% endif %}
    
            </div>
            {% else %}
            <p class="no-posts">No posts to display.</p>
            {% endfor %}
        </div>
        </center>
    
        <script>
            // Show alert if alert_message is present
            window.onload = function() {
                var alertMessage = "{{ alert_message }}";
                if (alertMessage) {
                    alert(alertMessage);
                }
            };
        </script>
    </body>

</html>
