<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Post</title>
    <link rel="icon" type="image/png" href="static/title-icon/title-icon.jpg">
    <style>
        body {
            font-family: "Poppins", sans-serif;
            background-color: #f8f9fa;
            text-align: center;
            padding-top: 100px;
        }
        textarea {
            width: 60%;
            height: 120px;
            border-radius: 10px;
            padding: 10px;
            font-size: 16px;
        }
        button {
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        a {
            display: block;
            margin-top: 20px;
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>
<body>
    <h2>Edit Your Post</h2>
    <form method="POST">
        <textarea name="new_content" required>{{ post['content'] }}</textarea><br>
        <button type="submit">Save Changes</button>
    </form>
    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
</body>
</html>
