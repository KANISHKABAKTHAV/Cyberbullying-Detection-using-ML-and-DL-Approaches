<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Post</title>
    <link rel="icon" type="image/png" href="static/title-icon/title-icon.jpg">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
        * {
            font-family: "Poppins", sans-serif;
        }

        body {
            background-image: url('{{ url_for("static", filename="post.jpg") }}');
            background-position: center;
            background-repeat: repeat;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .post-container {
            width: 500px;
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header {
            background: #007bff;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
        }

        .header .buttons {
            display: flex;
            gap: 10px;
        }

        .header a {
            background: white;
            color: #007bff;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s ease-in-out;
        }

        .header a:hover {
            background: #0056b3;
            color: white;
        }

        h2 {
            text-align: center;
            color: #1da1f2;
            font-size: 20px;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccd6dd;
            border-radius: 8px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #1da1f2;
        }

        .file-input {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }

        .file-input label {
            background: #1da1f2;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .file-input input {
            display: none;
        }

        .post-button {
            background: #1da1f2;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .post-button:hover {
            background: #1991da;
        }

        a.back-link {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #ffffff;
            padding: 8px;
            text-decoration: none;
            color: black;
            border-radius: 5px;
        }

        .flash {
            background: #d1e7dd;
            color: #0f5132;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <a href="{{ url_for('dashboard') }}" class="back-link">Back</a>

    <div class="post-container">
        <h2>Create a Post</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data">
            <textarea name="user_input" placeholder="Write your post here..." required></textarea><br><br>
            
            <button type="submit" class="post-button" name="action" value="predict">Predict</button>

            {% if prediction %}
                <h3 style="color: #1da1f2;">Prediction: {{ prediction }}</h3>
            {% endif %}

            <div class="file-input">
                <label for="post_image">📷 Upload Image</label>
                <input type="file" id="post_image" name="post_image">
            </div>
        </form>
    </div>
</body>
</html>
